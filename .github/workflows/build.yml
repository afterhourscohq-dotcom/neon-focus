name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ['store/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: com.afterhoursco.neonfocus
  APP_NAME: Neon Focus
  VERSION: "1.0"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Capacitor Android project
        run: |
          cat > package.json <<J
          {"name":"neon-focus","version":"${VERSION}.${{ github.run_number }}","private":true}
          J
          cat > capacitor.config.json <<J
          {"appId":"${APP_ID}","appName":"${APP_NAME}","webDir":"www","backgroundColor":"#07020f",
           "android":{"backgroundColor":"#07020f"},"ios":{"backgroundColor":"#07020f","contentInset":"never"}}
          J
          npm i @capacitor/core@latest @capacitor/android@latest
          npm i -D @capacitor/cli@latest
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' $M
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}.${{ github.run_number }}\"/" $G
          grep -nE "versionCode|versionName|applicationId" $G
          pip install pillow
          python3 tools/icons.py --android android/app/src/main/res

      - name: Build (signed if the upload key is set up)
        env:
          KS_B64: ${{ secrets.NEONFOCUS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NEONFOCUS_KEYSTORE_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          mkdir -p ../out
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=neonfocus -Pandroid.injected.signing.key.password=$KS_PASS"
            ./gradlew bundleRelease assembleRelease $SIGN --no-daemon
            cp app/build/outputs/bundle/release/app-release.aab ../out/NeonFocus-GooglePlay.aab
            cp app/build/outputs/apk/release/app-release.apk ../out/NeonFocus.apk
            echo "SIGNED=yes" >> $GITHUB_ENV
          else
            echo "::warning::No upload key in repo secrets yet, so this is a debug build. Add NEONFOCUS_KEYSTORE_B64 and NEONFOCUS_KEYSTORE_PASSWORD to get a Google Play bundle."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../out/NeonFocus.apk
            echo "SIGNED=no" >> $GITHUB_ENV
          fi
          ls -la ../out

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}.${{ github.run_number }}
          name: Neon Focus ${{ env.VERSION }}.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            **Phone install:** download NeonFocus.apk on an Android phone and open it.
            Permanent link to the newest build: https://github.com/${{ github.repository }}/releases/latest/download/NeonFocus.apk

            **Google Play:** upload NeonFocus-GooglePlay.aab in Play Console (only present when the upload key is set up; signed: ${{ env.SIGNED }}).

            App ID ${{ env.APP_ID }} · version ${{ env.VERSION }}.${{ github.run_number }}

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Capacitor iOS project
        run: |
          cat > package.json <<J
          {"name":"neon-focus","version":"${VERSION}.${{ github.run_number }}","private":true}
          J
          cat > capacitor.config.json <<J
          {"appId":"${APP_ID}","appName":"${APP_NAME}","webDir":"www","backgroundColor":"#07020f",
           "ios":{"backgroundColor":"#07020f","contentInset":"never"}}
          J
          npm i @capacitor/core@latest @capacitor/ios@latest
          npm i -D @capacitor/cli@latest
          npx cap add ios
          npx cap sync ios
          P=ios/App/App/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Delete :UISupportedInterfaceOrientations" $P || true
          $B -c "Add :UISupportedInterfaceOrientations array" $P
          $B -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          $B -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          $B -c "Delete :ITSAppUsesNonExemptEncryption" $P || true
          $B -c "Add :ITSAppUsesNonExemptEncryption bool false" $P
          $B -c "Set :CFBundleDisplayName ${APP_NAME}" $P || $B -c "Add :CFBundleDisplayName string ${APP_NAME}" $P
          $B -c "Delete :UIStatusBarHidden" $P || true
          $B -c "Add :UIStatusBarHidden bool true" $P
          X=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E 's/TARGETED_DEVICE_FAMILY = "?1,2"?;/TARGETED_DEVICE_FAMILY = 1;/g' $X
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = ${VERSION};/g; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" $X
          grep -nE "TARGETED_DEVICE_FAMILY|MARKETING_VERSION|CURRENT_PROJECT_VERSION|PRODUCT_BUNDLE_IDENTIFIER" $X
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          python3 tools/icons.py --ios ios/App/App/Assets.xcassets

      - name: Test build for the iPhone simulator
        run: |
          cd ios/App
          if [ -d App.xcworkspace ] && [ -f Podfile ]; then (pod install || true); TGT="-workspace App.xcworkspace"; else TGT="-project App.xcodeproj"; fi
          xcodebuild $TGT -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 25

      - name: Save the Xcode project
        run: zip -qr NeonFocus-iOS-project.zip ios package.json capacitor.config.json www -x "ios/App/build/*" "*/DerivedData/*"
      - uses: actions/upload-artifact@v4
        with:
          name: NeonFocus-iOS-project
          path: NeonFocus-iOS-project.zip
